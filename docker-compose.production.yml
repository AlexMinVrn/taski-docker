volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    # Из какого Dockerfile собирать образ для этого контейнера:
    image: alexmin1404/taski_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
    # Какие контейнеры нужно запустить до старта этого контейнера:
    depends_on:
      - db
  # Имя третьего контейнера. Это контейнер с фронтендом
  frontend:
    image: alexmin1404/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: alexmin1404/taski_gateway
    env_file: .env
    depends_on:
      - backend
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80